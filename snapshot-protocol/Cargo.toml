[package]
name = "snapshot-protocol"
version = "0.1.0"
edition = "2021"
description = "Signed control-plane snapshot protocol shared by Vibeploy runtime components"
license = "MIT"

[dependencies]
base64 = "0.22"
chrono = "0.4"
hex = "0.4"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
