[package]
name = "vrt-local"
version = "0.1.0"
edition = "2021"
description = "Standalone-mode control plane for the Vibeploy Workers runtime — local signed-desired production, bundle packing, file-backed state (T16)"
license = "MIT"

[dependencies]
vrt-config = { path = "../vrt-config" }
vrt-metrics = { path = "../vrt-metrics" }
vrt-securefs = { path = "../vrt-securefs" }
snapshot-protocol = { path = "../snapshot-protocol" }
cell-controller = { path = "../cell-controller" }
vrt-provider = { path = "../vrt-provider" }
base64 = "0.22"
chrono = "0.4"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
axum = { version = "0.8", features = ["json"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ring = "0.17"
thiserror = "2"
toml = "0.8"
rolldown = "1.3"
rolldown_common = "=1.3.2"
nodejs-built-in-modules = "1.0"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
