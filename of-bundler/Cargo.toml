[package]
name = "of-bundler"
version = "0.1.0"
edition = "2021"
publish = false

# Own workspace, deliberately: rolldown's dep tree enables serde_json
# `preserve_order` + `arbitrary_precision`, and cargo feature
# unification would leak those semantics into the main workspace's
# serde_json (signed desired-state documents, wire shapes, golden
# fixtures, axum Json serialization of Value fields). Keeping rolldown
# in a separate build graph is the only complete isolation — `of`
# talks to this helper over a version-locked JSON stdio protocol.
[workspace]

[dependencies]
rolldown = "1.3.2"
rolldown_common = "1.3.2"
nodejs-built-in-modules = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
