[package]
name = "vrt-provider"
version = "0.1.0"
edition = "2021"
description = "Typed Workers binding provider implementing the private binding-backend protocol subset (KV, R2) for the Vibeploy runtime"
license = "MIT"

[dependencies]
async-trait = "0.1"
axum = "0.8"
http-body = "1"
base64 = "0.22"
bytes = "1"
chrono = "0.4"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
md5 = "0.7"
quick-xml = { version = "0.38", features = ["serialize"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
snapshot-protocol = { path = "../snapshot-protocol" }
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7"] }
vrt-metrics = { path = "../vrt-metrics" }
vrt-objstore = { path = "../vrt-objstore" }
vrt-securefs = { path = "../vrt-securefs" }
sqlite-vec = "0.1.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
http-body-util = "0.1"
vrt-sql = { path = "../vrt-sql" }
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3.27.0"
