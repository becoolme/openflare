[package]
name = "cell-controller"
version = "0.1.0"
edition = "2021"
description = "compute.desired cell controller: verify, assign, ack, cron leadership, health (Phase 1 T8)"
license = "MIT"
default-run = "cell-controller"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snapshot-protocol = { path = "../snapshot-protocol" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
vrt-metrics = { path = "../vrt-metrics" }
vrt-securefs = { path = "../vrt-securefs" }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
vrt-config = { path = "../vrt-config" }
vrt-provider = { path = "../vrt-provider" }

[[bin]]
name = "cell-controller"
path = "src/bin/cell-controller.rs"

[dev-dependencies]
tempfile = "3"
vrt-sql = { path = "../vrt-sql" }
