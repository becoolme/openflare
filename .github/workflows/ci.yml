name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-cjk:
    name: No CJK in tracked files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check for CJK characters
        run: python3 scripts/check-no-cjk.py

  rust:
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # vrt-config/tests/workerd_schema.rs checks generated configs against
      # the workerd.capnp of the pinned workerd version. The lock knows where
      # that schema lives for either pin source (npm, or a GitHub release of
      # the fork); this only downloads the schema, no binary.
      - name: Fetch workerd.capnp for the pinned workerd
        run: |
          set -euo pipefail
          scripts/fetch-workerd.sh --capnp-only --out "$RUNNER_TEMP/workerd"
          echo "WORKERD_CAPNP=$RUNNER_TEMP/workerd/workerd.capnp" >> "$GITHUB_ENV"
      # of-bundler is its own cargo workspace (rolldown's serde_json
      # feature flags must not unify with the main graph). bundle_sync
      # resolves it from of-bundler/target/debug/ at test time.
      - name: Build of-bundler helper
        run: cargo build --locked --manifest-path of-bundler/Cargo.toml
      # Tests that need a real workerd binary (VRT_WORKERD_BIN) skip here.
      # No debuginfo: tests do not need it and it keeps the linker small.
      - name: cargo test
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: cargo test --locked --workspace --no-fail-fast
      # `VRT_DEPLOY_TOML_DIRS` is unset above (a consumer's manifests are
      # their own gate); this loads openflare's own `examples/` through the
      # same real loaders, so the documented configs cannot rot.
      # Same profile settings as the step above: a differing
      # CARGO_PROFILE_*_DEBUG / CARGO_INCREMENTAL changes the profile hash
      # and rebuilds every dependency instead of reusing its artifacts.
      - name: Example deployment TOMLs load
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: scripts/ci-deploy-tomls.sh

  clippy:
    name: Unsafe blocks are documented
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The only clippy gate: every production `unsafe` block carries a
      # `// SAFETY:` comment. Other clippy lints stay warnings so a
      # toolchain bump cannot fail the job on style.
      - name: Clippy (unsafe blocks are documented)
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          cargo clippy --locked --workspace --lib --bins -- \
            -D clippy::undocumented_unsafe_blocks

  # The repo never downloads workerd for build/runtime images (README
  # "Quick start": you supply the pinned binary yourself). This job is
  # the sanctioned exception: a TEST-ONLY helper that fetches the
  # @cloudflare/workerd-linux-64 npm package at exactly the version
  # pinned in deploy/docker/workerd.lock, verifies BOTH the tarball
  # integrity (sha512) and the binary SHA-256 against the lock, and
  # runs the VRT_WORKERD_BIN-gated tests via
  # scripts/ci-real-workerd.sh. Any digest mismatch fails the job —
  # the lock is the pin of record, never worked around.
  real-workerd:
    name: Real-workerd tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: real-workerd-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      # m18 bundles the real `pg` driver with the repo's pinned esbuild;
      # the exact versions the test resolves live in devDependencies.
      - name: Install workspace dependencies (esbuild/pg for m18)
        run: pnpm install --frozen-lockfile
      # m17/m18 start a throwaway PostgreSQL 16 with initdb/pg_ctl. The
      # runner images usually ship it; install it when the bin dir is
      # absent so the two Hyperdrive proofs cannot silently skip.
      - name: Resolve PostgreSQL 16 bin dir
        run: |
          set -euo pipefail
          bin=/usr/lib/postgresql/16/bin
          if [ ! -x "$bin/initdb" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          echo "VRT_TEST_PG_BIN=$bin" >> "$GITHUB_ENV"
      - name: Read pinned version and digest from workerd.lock
        id: lock
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("deploy/docker/workerd.lock", "utf8"));
            const art = lock.artifacts && lock.artifacts["linux-x64"];
            if (!lock.version || !art || !art.binarySha256) {
              console.error("workerd.lock has no linux-x64.binarySha256 — update the lock (see deploy/docker/workerd.lock) and retry");
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `version=${lock.version}\nsha256=${art.binarySha256}\n`);
          '
      # Cache keyed on the binary digest: a lock bump or a tampered
      # cache both miss; the post-restore step re-verifies the digest.
      - name: Cache workerd binary
        id: cache
        uses: actions/cache@v4
        with:
          path: .ci/workerd
          key: workerd-linux-x64-${{ steps.lock.outputs.sha256 }}
      - name: Fetch and verify pinned workerd binary
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # scripts/fetch-workerd.sh verifies every digest the lock lists
          # (sha512 tarball integrity for npm pins, sha256 for the asset and
          # the decompressed binary otherwise) and materializes both the
          # binary and the schema the same way local runs do.
          scripts/fetch-workerd.sh --out .ci/workerd --platform linux-x64
      - name: Verify binary digest (cache hit or fresh fetch)
        run: |
          set -euo pipefail
          echo "${{ steps.lock.outputs.sha256 }}  .ci/workerd/workerd" | sha256sum -c -
          .ci/workerd/workerd --version
      - name: Verify generated compatibility flags against pinned workerd
        run: python3 vrt-config/compat/gen_compat_flags.py --check --check-workerd .ci/workerd/workerd
      # Bundle-enabled deploys shell out to the of-bundler helper; it is
      # a separate cargo workspace (rolldown serde_json isolation) so it
      # needs its own build — the manifest-dir fallback resolves it.
      - name: Build of-bundler helper
        run: cargo build --locked --manifest-path of-bundler/Cargo.toml
      # d1_smoke locates target/debug/vrt-sql itself — build bins once.
      - name: cargo build --bins
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: cargo build --locked --workspace --bins
      # workerd's tcmalloc reserves tens of GB of virtual address space
      # per process; under the default heuristic overcommit mode the
      # kernel refuses that mprotect once a second generation starts
      # next to a live one ("Cannot allocate memory"). Reservations are
      # not touched memory, so allow them on the throwaway runner.
      - name: Allow virtual address reservations for workerd
        run: sudo sysctl -w vm.overcommit_memory=1
      - name: Run VRT_WORKERD_BIN-gated tests
        timeout-minutes: 40
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: |
          scripts/ci-real-workerd.sh \
            "$GITHUB_WORKSPACE/.ci/workerd/workerd" \
            "$GITHUB_WORKSPACE/.ci/workerd/workerd.capnp"
      # The config sandbox is Node + workerd + the of-bundler helper. It
      # runs the two production helpers (Node baseline and the workerd
      # dynamic-worker path) against parity and hostile-config cases.
      - name: Config sandbox (workerd dynamic worker) verification
        env:
          VRT_WORKERD_BIN: ${{ github.workspace }}/.ci/workerd/workerd
          OF_BUNDLER: ${{ github.workspace }}/of-bundler/target/debug/of-bundler
        run: node spike/config-sandbox/verify.mjs --workerd "$VRT_WORKERD_BIN"
      # Drift detector, not a gate: run the conformance cases against
      # workerd's bundled modules (kv/d1/r2/ratelimits). `only bundled
      # passes` rows are behaviour our facades are missing; a red step
      # here means the *expectation* or a facade drifted, so it must not
      # block unrelated PRs until the divergences are triaged.
      - name: Conformance against workerd's bundled modules
        continue-on-error: true
        run: |
          node conformance/reference.mjs             --workerd "$GITHUB_WORKSPACE/.ci/workerd/workerd"             --capnp "$GITHUB_WORKSPACE/.ci/workerd/workerd.capnp"
      - name: Upload bundled-reference report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundled-reference-report
          path: |
            conformance/results/bundled.json
            conformance/results/bundled.md
          if-no-files-found: ignore
          retention-days: 14
      # Tests keep their /tmp/vrt-* roots on panic (announced via
      # stderr) — collect them plus rendered configs and workerd logs.
      - name: Collect test logs on failure
        if: failure()
        run: |
          set -uo pipefail
          mkdir -p .ci/logs
          shopt -s nullglob
          for d in /tmp/vrt-* "$GITHUB_WORKSPACE"/target/tmp-*; do
            cp -a "$d" .ci/logs/ 2>/dev/null || true
          done
      - name: Upload workerd/host logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-workerd-logs
          path: .ci/logs
          if-no-files-found: ignore
          retention-days: 14

  runtime-alerts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate and load the canonical runtime alert rules
        run: deploy/standalone/alerts-e2e.sh

  persistence-fuzz:
    name: Persistence fuzz (repeated kill -9)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `kill9_fuzz_repeated` is `#[ignore]`d: kill -9 rounds over a growing
      # insert stream (5 slices, ~2 rounds each -- one killed at half its
      # slice, one completing it), every round followed by a lease takeover
      # that must prove the acked rows survived. It stays a bounded gate
      # (5k rows, a few minutes); the 100k-row soak is the separate
      # `kill9_fuzz_100k` test, far too slow for per-PR CI. Naming the test
      # keeps `--ignored` from also pulling in the unix-bind / workerd gates.
      - name: Persistence fuzz (repeated kill -9)
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: |
          cargo test --locked -p vrt-sql --test persist_tests kill9_fuzz_repeated \
            -- --ignored --nocapture

  node:
    name: Facade and contract checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # gen-manifest.mjs uses node:module stripTypeScriptTypes; the
      # committed manifest bytes are produced with Node 24.
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - name: Facade manifest is up to date
        run: npm run facade:check
      - name: Facade tests
        run: npm run test:facade
      - name: Contract checks
        run: npm run test:contract
      - name: Docs match the binding surface
        run: npm run test:docs
      - name: Conformance runner tests
        run: npm run test:conformance
      - name: Compat flag list is up to date
        run: python3 vrt-config/compat/gen_compat_flags.py --check
