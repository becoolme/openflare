# vrt-sql: D1/Queues data-plane SQL service (Phase 3 / P3a first cut).
#
# Dependency constraint (T33): rusqlite may only use 0.40.2 from the local cargo cache (bundled,
# libsqlite3-sys 0.38.2); all other dependencies use only items already in the workers-runtime workspace.
[package]
name = "vrt-sql"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1"
axum = "0.8"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "limits", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
vrt-metrics = { path = "../vrt-metrics" }
vrt-objstore = { path = "../vrt-objstore" }
vrt-securefs = { path = "../vrt-securefs" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
