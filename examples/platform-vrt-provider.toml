# VRT 平台模式 —— vrt-provider（binding-backend）示例配置。键名 camelCase。
cellId = "cell-mvp-1"
listenerDir = "__VRT_ROOT__/provider/listeners"          # 0700
operationTimeoutMs = 30000
tenantConcurrency = 64
globalConcurrency = 512
bodyReadTimeoutMs = 30000
drainTimeoutMs = 30000

[desired]
path = "__VRT_ROOT__/pods/pod-0/envelope.json"           # 与 vrt-host 读同一份签名 envelope
trustedKeys = [
  { keyId = "bf29c9743adb0a97f43ae4bc", publicKey = "MCowBQYDK2VwAyEAO4cbNjsO7FQzisOvZshKKMa67lIim3ikig7RdntOAZM=" },
]
reloadMs = 1000
graceVersions = 1

[kvrocks]
urlEnv = "VRT_KVROCKS_URL"                               # 凭据经 env，不写入配置

[s3]
endpoint = "https://s3.internal.example"
region = "vrt"
bucket = "vrt-r2-prod"
accessKeyEnv = "VRT_S3_ACCESS_KEY"
secretKeyEnv = "VRT_S3_SECRET_KEY"
conditionalWrites = true                                 # 后端不支持时条件 put 失败而非降级
