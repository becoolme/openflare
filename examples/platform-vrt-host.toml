# VRT platform mode -- vrt-host example config (pod mode: cell-controller delivers
# envelope+assignment through FileEnvelopePodChannel).
# Replace the __VRT_*__ placeholders at deploy time; contains no real secrets. Key names are serde camelCase.
cellId = "cell-mvp-1"
workerdBinary = "__WORKERD__"                           # absolute path of the pinned-version workerd
workDir = "__VRT_ROOT__/pods/pod-0/work"                # 0700
cacheDir = "__VRT_ROOT__/pods/pod-0/cache"              # 0700
listenAddr = "127.0.0.1:8080"
controlListen = "127.0.0.1:9091"                        # readyz/healthz (loopback enforced)
# P3c-1: DO storage root -- on K8s this must be a persistent volume (data survives pod recreation;
# cross-cell placement/fencing is P3c-2; until that lands, DO is usable on this pod only).
doStorageDir = "__VRT_ROOT__/pods/pod-0/do"
allowLocalDurability = true # RV-R66: dev example, single-copy DO state

[desired]
path = "__VRT_ROOT__/pods/pod-0/envelope.json"          # written by FileEnvelopePodChannel
podId = "pod-0"                                         # bound to assignment.podId
assignmentFile = "__VRT_ROOT__/pods/pod-0/assignment.json"
trustedKeys = [
  { keyId = "bf29c9743adb0a97f43ae4bc", publicKey = "MCowBQYDK2VwAyEAO4cbNjsO7FQzisOvZshKKMa67lIim3ikig7RdntOAZM=" },
]
reloadMs = 1000
graceVersions = 1

[render]
mode = "capnp"
# T16/B3: params are derived from the facade manifest at startup (mutually exclusive with paramsFile;
# configuring both = two sources of truth, validate refuses to start)
facadeManifest = "__VRT_ROOT__/facade/manifest.json"
# H5-r1: binding-backend is derived per tenant -- points at the provider's
# listenerDir (each tenant renders to <dir>/<seg(tenant)>.sock, byte-for-byte identical to the
# provider's bind path). In assignmentFile mode a verbatim
# bindingBackendSocket is forbidden (a static socket would make all tenants share one tenant
# listener -- cross-tenant privilege escalation).
bindingBackendDir = "__VRT_ROOT__/provider/listeners"
systemCompatDate = "2024-09-25"
systemCompatFlags = []
secretsFile = "__VRT_ROOT__/secrets/render-secrets.json"  # 0600, {tenantId:{ref:value}}
extraArgs = []

[bundles]                                                # T15/B2 control-plane bundle fetch
baseUrl = "https://cp.internal/api/internal/clusters/cl_mvp_1"
tokenFile = "__VRT_ROOT__/secrets/cell-token"              # 0600
requestTimeoutMs = 10000
deadlineMs = 30000
maxAttempts = 3
maxBytes = 33554432

[supervisor]
readyTimeoutMs = 10000
probeTimeoutMs = 200
killGraceMs = 5000
backoffBaseMs = 200
backoffMaxMs = 10000
# T27/N0: the failure window must hold (failThreshold-1) launch cycles
# — (5-1)×(10s ready + 10s max backoff) = 80s ≤ 90s.
failWindowMs = 120000

[limits]
# maxRssBytes = 268435456
# maxFds = 1024

[ingress]
requestTimeoutMs = 30000
connectTimeoutMs = 500
maxBodyBytes = 1048576
# MIG-7: match deploy/k8s — Traefik's X-Forwarded-Proto is honored
# only from the pod CIDR; every other source fails closed to http.
forwardedProto = "trusted-proxy-header"
forwardedProtoTrusted = ["10.42.0.0/16"]

[baseEnv]
# VRT_EXTRA = "value"
