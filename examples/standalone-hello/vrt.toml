# Minimal standalone worker — one var + one secret binding.
name = "hello"
mainModule = "main.js"
compatibilityDate = "2024-09-25"
hostnames = ["hello.vrt.local"]

[vars]
GREETING = "hello from a var"

[secrets]
# Binding name → secretRef. Values never live in this file — put them
# with `vrt secret put --root <root> greeting-secret` (stdin).
GREETING_SECRET = "greeting-secret"
