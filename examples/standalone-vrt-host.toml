# VRT standalone mode -- vrt-host example config.
# Same shape as celld: single instance, single trusted owner. No cell-controller/
# assignment -- the desired envelope is signed locally by vrt-local and written to disk directly;
# bundles use a local directory source (objects/<digest>, consistent with the vrt-local write side).
# __VRT_ROOT__ = the root directory of `vrt init` (e.g. ~/.vrt). Key names are camelCase.
cellId = "__VRT_CELL__"
workerdBinary = "__WORKERD__"
workDir = "__VRT_ROOT__/work"
cacheDir = "__VRT_ROOT__/objects"                        # bundle cache directory (written by host)
listenAddr = "__VRT_LISTEN__"
controlListen = "__VRT_CONTROL__"                         # optional; for local observation
metricsListen = "__VRT_METRICS__"                         # B12: /metrics only (internal, do not publish to the public internet)
# P3c-1: Durable Object storage root -- <dir>/<seg(tenant)>/<workerId>/<uniqueKey>/.
# Must be outside workDir (gen-* directories get swept); if missing, DO tenant assembly is refused.
doStorageDir = "__VRT_ROOT__/do"
allowLocalDurability = true # RV-R66: dev example, single-copy DO state

[bundles]
# T25/L5: ONE object convention -- vrt-local deploy/seed writes
# `objects/<digest>`, and the host's local bundle source reads the same directory.
dir = "__VRT_ROOT__/objects"

[desired]
path = "__VRT_ROOT__/desired/envelope.json"              # written atomically by vrt-local deploy
trustedKeys = [
  { keyId = "__VRT_KEY_ID__", publicKey = "__VRT_PUBKEY__" },  # rendered by vrt init
]
reloadMs = 1000
graceVersions = 1

[render]
mode = "capnp"
facadeManifest = "__VRT_ROOT__/facade/manifest.json"
# T25/L13: points at the provider's per-tenant listener sockets --
# the provider binds <listenerDir>/<enc(tenant)>.sock, and both sides share
# the vrt_securefs::socket_path derivation (rendered by vrt init).
bindingBackendSocket = "__VRT_BACKEND_SOCK__"
systemCompatDate = "2024-09-25"
systemCompatFlags = []
# Per-worker quotas: render the workerd `limits` block (cpuMs /
# memoryMb / subRequests) for quotas a worker declares. The image's
# workerd comes from `deploy/docker/workerd.lock` (the VRT fork), which
# carries the limits patch. A STOCK workerd must set this to false (and
# then a tenant declaring a limit fails closed instead of running
# unlimited). 0 / platform-default dimensions are never rendered.
quotas = true
secretsFile = "__VRT_ROOT__/secrets/secrets.json"         # maintained by vrt-local secret put (0600)
varsFile = "__VRT_ROOT__/vars/vars.json"                  # maintained by vrt-local deploy (0600)
# T17/F1: both files are re-read + permission-checked on every converge -- secret/var changes
# take effect without a restart; a read failure -> render-inputs-unavailable, and the old generation keeps serving.


# T21: ASSETS materialization -- content-addressed storage shared with the provider; standalone
# is pre-written by `vrt deploy` (no baseUrl -> missing means fail closed).
[assets]
dir = "__VRT_ROOT__/provider/data/assets"

# P3c-2: DO placement lease + snapshots -- the same key surface as vrt-sql `[persistence]`
# (backend/fs/s3/leaseMs/clockSkewMarginMs). standalone uses the fs
# backend (an `objstore/do` subdirectory under the same root as the vrt-sql object volume -- namespace isolation,
# not mixed with D1 objects). CAS init/self-check failure -> refuse to start (fail closed,
# never fall back to LocalPlacement).
[placement]
backend = "fs"
leaseMs = 30000
clockSkewMarginMs = 5000
[placement.fs]
root = "__VRT_ROOT__/objstore/do"

# P3c-2: periodic snapshot cadence (ms). The interval has a 60s lower bound; e2e triggers manually via
# `POST /v1/do/snapshot` (loopback control plane).
[doSnapshots]
intervalMs = 300000
jitterMs = 30000

[supervisor]
readyTimeoutMs = 10000
# T27/N0: must satisfy failThreshold*(readyTimeoutMs+backoffMaxMs)
# — defaults 5×(10s+5s)=75s → 90s window.
failWindowMs = 90000

# C1: per-tenant Cache API — every tenant worker gets
# `cacheApiOutbound` bound to `<workDir>/cache/<seg(tenant)>.sock`
# (0711 root, 0600 socket chown'd to the tenant). Bare section =
# defaults (8MiB entry / 128MiB tenant / 512MiB service stored,
# 64MiB global / 32MiB per-tenant in-flight PUT bytes — C1-r2).
# Absent ⇒ no emit; `caches.*` throws `No Cache was configured`.
[cache]
# maxEntryBytes = 8388608
# tenantBytes = 134217728
# globalBytes = 536870912
# globalInflightBytes = 67108864
# tenantInflightBytes = 33554432

[ingress]
requestTimeoutMs = 30000
connectTimeoutMs = 500
maxBodyBytes = 1048576
# MIG-7: standalone is reached directly over plaintext — the
# `fixed-http` default is correct here (client headers are always
# stripped; nothing promotes the scheme).
