# VRT standalone mode -- vrt-sql example config (T34->T36).
# Persistence (T36 section 4): object-store fs backend, manifest CAS lease + segments uploaded
# before ack; backend=none is for test/dev only (WARN at startup, production rejects the default). Key names are camelCase.
dbRoot = "__VRT_ROOT__/sql/data"
listenTcp = "__VRT_SQL_LISTEN__"      # internal network; exactly one of this and unixDir
# unixDir = "__VRT_ROOT__/sql"       # or UDS: {unixDir}/vrt-sql.sock
metricsListen = "__VRT_SQL_METRICS__" # /metrics only (internal, not public)
bookmarkSecretFile = "__VRT_ROOT__/keys/sql-bookmark.secret"
authSecretFile = "__VRT_ROOT__/keys/sql-auth.secret"
globalConcurrency = 64
operationTimeoutMs = 5000
drainTimeoutMs = 30000
bodyMaxBytes = 1048576

[persistence]
backend = "fs"
leaseMs = 15000
clockSkewMarginMs = 500
checkpointEveryCommits = 64
retentionMs = 86400000
[persistence.fs]
# Separate object volume directory (standalone compose: a separate volume mounted at /data/objstore).
root = "__VRT_ROOT__/objstore"
