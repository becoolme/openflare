# VRT 独立模式 —— vrt-sql 示例配置（T34→T36）。
# 持久化（T36 §4）：对象存储 fs 后端，manifest CAS lease + ack 前段
# 上传；backend=none 仅测试/dev（启动 WARN，生产拒绝缺省）。键名 camelCase。
dbRoot = "__VRT_ROOT__/sql/data"
listenTcp = "__VRT_SQL_LISTEN__"      # 内部网络；与 unixDir 恰设其一
# unixDir = "__VRT_ROOT__/sql"       # 或 UDS：{unixDir}/vrt-sql.sock
metricsListen = "__VRT_SQL_METRICS__" # 仅 /metrics（内部，不公开）
bookmarkSecretFile = "__VRT_ROOT__/keys/sql-bookmark.secret"
authSecretFile = "__VRT_ROOT__/keys/sql-auth.secret"
globalConcurrency = 64
operationTimeoutMs = 5000
drainTimeoutMs = 30000
bodyMaxBytes = 1048576

[persistence]
backend = "fs"
leaseMs = 15000
clockSkewMarginMs = 500
checkpointEveryCommits = 64
retentionMs = 86400000
[persistence.fs]
# 独立对象卷目录（standalone compose: 独立卷挂在 /data/objstore）。
root = "__VRT_ROOT__/objstore"
