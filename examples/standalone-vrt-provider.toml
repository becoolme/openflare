# VRT standalone mode -- vrt-provider example config.
# KV can use a local kvrocks; R2 points at a user-supplied S3 (minio / any object store works). Key names are camelCase.
cellId = "__VRT_CELL__"
listenerDir = "__VRT_ROOT__/provider/listeners"
metricsListen = "__VRT_PROVIDER_METRICS__"                # B12: /metrics only (internal)
# T25/L8: the cursor HMAC secret is read from a 0600 file generated by init --
# never plaintext via env/compose. If missing or not 0600, the provider fails closed.
cursorSecretFile = "__VRT_ROOT__/keys/cursor.secret"

[desired]
path = "__VRT_ROOT__/desired/envelope.json"
trustedKeys = [
  { keyId = "__VRT_KEY_ID__", publicKey = "__VRT_PUBKEY__" },  # rendered by of init
]
reloadMs = 1000
graceVersions = 1

# T17: local filesystem backend (digest file names prevent traversal, 0600 atomic writes,
# tenant->namespace/bucket directory isolation, keyset/pagination semantics identical to the in-memory backend).
# kvrocks/s3 may be used instead (platform backends, side by side; mutually exclusive -- configuring both is rejected).
[kv]
dir = "__VRT_ROOT__/provider/data/kv"

[r2]
dir = "__VRT_ROOT__/provider/data/r2"

# T21: content-addressed storage for static assets (written by the of deploy --assets directory;
# vrt-host checks existence; the provider serves /internal/assets/v1/fetch by digest).
[assets]
dir = "__VRT_ROOT__/provider/data/assets"
# maxObjectBytes = 33554432   # optional, defaults to the same as the S3 backend

# P1: PG data plane -- the provider looks up, by credentialRef in this file,
# {token, endpoint, tenantSlug, credentialVersion, readOnly},
# in the format {tenants: {<tenantId>: {<credentialRef>: {...}}}}.
# File is 0600; missing/over-permissive -> the PG bindings that reference it fail closed
# (PG_CREDENTIAL_UNAVAILABLE), other bindings are unaffected.
[pg]
credentialsFile = "__VRT_ROOT__/secrets/pg-credentials.json"

# T34: D1 data plane -- provider -> vrt-sql (internal network + signed-token auth).
# authSecretFile is shared with the vrt-sql side as the same 0600 file (generated by of init);
# writes with an uncertain outcome are not retried (single send; timeout/failure -> D1 error surface).
[vrtSql]
addr = "__VRT_SQL_ADDR__"
authSecretFile = "__VRT_ROOT__/keys/sql-auth.secret"
# timeoutMs = 30000
