# VRT platform mode -- cell-controller example config.
# At deploy time replace every __VRT_*__ placeholder with a real path/address; this file contains no real secrets.
cell_id = "cell-mvp-1"
control_plane_url = "https://cp.internal"
token_file = "__VRT_ROOT__/secrets/cell-token"       # 0600, scoped ingest token (vrt.cell-controller)
health_listen = "0.0.0.0:9090"
poll_interval_secs = 10
fence_file = "__VRT_ROOT__/state/fence.json"          # persisted revision fence (required)
# egress_required = true is the default and must stay true in production: tenants are not delivered until the
# NetworkPolicy apply + read-back is confirmed. Only set it to false explicitly for local development (it emits a
# structured warn and healthz always reports egressPolicyDisabled; see workers-runtime-cell-controller.md).

# Runtime NetworkPolicy (T13/M1; fill in pod/service CIDRs for the actual cluster)
[netpolicy]
policy_name = "vrt-tenant-egress"
namespace = "vrt"
pod_selector = { app = "vrt-host" }
ingress_port = { protocol = "tcp", port = 8080 }
node_excepts = ["10.0.0.0/8"]
pod_cidrs = ["10.42.0.0/16"]
service_cidrs = ["10.43.0.0/16"]
# Allowlist of publicly reachable ports (T13/M1: empty = unreachable, not open)
public_ports = [{ protocol = "tcp", port = 80 }, { protocol = "tcp", port = 443 }]
# The shared entrypoint (Traefik) can reach the workerd ingress port
[[netpolicy.ingress_peers]]
namespace_labels = { "kubernetes.io/metadata.name" = "traefik" }
pod_labels = { app = "traefik" }
# Cluster DNS (kube-dns): UDP/TCP 53
[netpolicy.dns_peer]
namespace_labels = { "kubernetes.io/metadata.name" = "kube-system" }
pod_labels = { "k8s-app" = "kube-dns" }
# Platform data-plane backends (kvrocks/s3 gateway), selector or cidr + a single port
[[netpolicy.backends]]
selector = { peer = { namespace_labels = { "kubernetes.io/metadata.name" = "vrt-data" }, pod_labels = { app = "kvrocks" } }, port = { protocol = "tcp", port = 6666 } }
[[netpolicy.backends]]
cidr = { cidr = "203.0.113.10/32", port = { protocol = "tcp", port = 443 } }

# Control-plane Ed25519 verification public key (example value from the shared golden fixture, not a real key)
[[trusted_keys]]
keyId = "bf29c9743adb0a97f43ae4bc"
publicKey = "MCowBQYDK2VwAyEAO4cbNjsO7FQzisOvZshKKMa67lIim3ikig7RdntOAZM="

# One delivery directory per pod + readyz probe (T14/B1 FileEnvelopePodChannel)
[[pods]]
id = "pod-0"
dir = "__VRT_ROOT__/pods/pod-0"                        # 0700
readyz = "http://127.0.0.1:9091"
