# OPTIONAL: store the data volume on a HOST directory instead of a
# named volume. Docker does NOT chown bind sources — you must create
# and own it as the container uid before `up`:
#   sudo mkdir -p /srv/vrt-data && sudo chown 10001:10001 /srv/vrt-data
# then:
#   docker compose -f docker-compose.yml -f docker-compose.host-dir.yml up
services:
  vrt-init: {volumes: ["/srv/vrt-data:/data"]}
  vrt: {volumes: ["/srv/vrt-data:/data"]}
  vrt-host: {volumes: ["/srv/vrt-data:/data"]}
  vrt-provider: {volumes: ["/srv/vrt-data:/data"]}
  vrt-sql: {volumes: ["/srv/vrt-data:/data"]}
