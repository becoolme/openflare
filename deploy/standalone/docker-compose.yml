# VRT standalone — one-compose quick start.
#
#   WORKERD_SOURCE=file WORKERD_SHA256=$(shasum -a256 deploy/standalone/workerd | cut -d' ' -f1) \
#     docker compose -f deploy/standalone/docker-compose.yml up --build
#
# WORKERD_SOURCE is REQUIRED for `build`/`up --build` (T25/L10+M5 —
# no silent stub default). The `:-unset-required` sentinel keeps
# non-build ops (`config`, `down`, `exec`) working without the env
# set: docker's stage resolution then fails the BUILD with
# `target stage "workerd-unset-required" could not be found`, which
# names the missing variable — readable, still fail closed.
#   file  — deploy/standalone/workerd (git-ignored) + WORKERD_SHA256
#   image — WORKERD_IMAGE pinned image containing /usr/local/bin/workerd
# or use a pinned image: WORKERD_SOURCE=image WORKERD_IMAGE=repo/workerd@sha256:…
# The stub smoke profile is docker-compose.stub.yml.

name: vrt-standalone

x-vrt-common: &vrt-common
  user: "${VRT_UID:-10001}:${VRT_GID:-10001}"
  volumes:
    - vrt-data:/data
  restart: unless-stopped
  # Resource-limit examples (compose v3 keys; honored by docker run
  # --memory/--cpus equivalents under Swarm/k8s too):
  # deploy:
  #   resources:
  #     limits: { cpus: "2.0", memory: 512M }

x-vrt-image: &vrt-image
  # T24/K4: ONE build — vrt-init is the only service carrying `build:`;
  # every service shares the resulting local tag. `pull_policy: never`
  # fails fast instead of pulling a nonexistent registry image; the
  # builder overrides it with `build` so compose builds on demand.
  image: vrt-standalone:${VRT_IMAGE_TAG:-local}
  pull_policy: never

services:
  vrt-init:
    <<: [*vrt-common, *vrt-image]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.vrt-local
      # T25/L10: prod image target — vrt-host WITHOUT dev-stub.
      target: runtime
      args:
        # T25/L10: NO stub default — a bare `up` must fail closed with
        # a clear message instead of silently rebuilding a stub image.
        WORKERD_SOURCE: ${WORKERD_SOURCE:-unset-required}
        WORKERD_IMAGE: ${WORKERD_IMAGE:-debian:bookworm-slim}
        WORKERD_SHA256: ${WORKERD_SHA256:-}
        VRT_UID: ${VRT_UID:-10001}
        VRT_GID: ${VRT_GID:-10001}
    pull_policy: build
    restart: "no"
    entrypoint: ["/usr/local/bin/of"]
    command:
      - init
      - --root
      - /data
      - --cell
      - ${VRT_CELL:-local}
      - --tenant
      - ${VRT_TENANT:-local}
      # D5: no --mode — of init detects the runtime kind from
      # `workerd --version`; an explicit --mode must AGREE with it.
      # The path is the unique runtime layout (/usr/local/bin/workerd);
      # WORKERD_SOURCE=none leaves it absent → init fails closed.
      - --workerd
      - /usr/local/bin/workerd
      - --ingress-listen
      - 0.0.0.0:8080
      # B12: metrics binds on all interfaces INSIDE the compose
      # network (never published to the host — see `ports:`), so the
      # optional `monitoring` profile can scrape them.
      - --metrics-listen
      - 0.0.0.0:9494
      - --provider-metrics-listen
      - 0.0.0.0:9493
      - --vrt-sql-metrics-listen
      - 0.0.0.0:9492
      # DEV/CI ONLY: both named volumes (vrt-data + vrt-sql-objects)
      # live on ONE Docker device, so vrt-sql's fail-closed durability
      # guard ("persistence root must be on a different device from
      # dbRoot") would reject the stack at boot. This flag opts into the
      # dev exemption in the generated vrt-sql.toml. Production must NOT
      # pass it: keep the object store on a separate device, or use the
      # s3 persistence backend.
      - --dev-allow-same-device-durability

  vrt:
    <<: [*vrt-common, *vrt-image]
    depends_on:
      vrt-init:
        condition: service_completed_successfully
      # T37b-r4: the netns owner must exist before `vrt` joins it.
      vrt-host:
        condition: service_started
    # T37b-r4: `of serve` (queue dispatcher + cron) dials vrt-host's
    # control listener, which is LOOPBACK-only by design (config.rs
    # rejects non-loopback controlListen — it is unauthenticated).
    # In the split-container topology loopback only resolves if `vrt`
    # shares vrt-host's network namespace — the same reachability the
    # bare-metal single-host layout has for free. `of serve` binds no
    # TCP listener — its mgmt is a unix socket under /data — so the shared
    # netns exposes nothing extra. Caveat: `force-recreate` of
    # vrt-host orphans this netns — recreate `vrt` with it.
    network_mode: "service:vrt-host"
    entrypoint: ["/usr/local/bin/of"]
    # Control plane only in compose mode — the host/provider run in
    # their own containers (supervision happens per-container).
    command: [serve, --root, /data]
    healthcheck:
      # Unix-socket healthz via the CLI's own probe endpoint.
      test: ["CMD", "/usr/local/bin/of", "health", "--root", "/data"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  vrt-host:
    <<: [*vrt-common, *vrt-image]
    depends_on:
      vrt-init:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/vrt-host"]
    command: ["--config", "/data/config/vrt-host.toml"]
    ports:
      - "${VRT_BIND:-127.0.0.1}:${VRT_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/of", "probe", "--url", "http://127.0.0.1:9091/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  vrt-provider:
    <<: [*vrt-common, *vrt-image]
    depends_on:
      vrt-init:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/vrt-provider"]
    command: ["--config", "/data/config/vrt-provider.toml"]
    healthcheck:
      # D8: connect every listener socket — liveness, not file-exists.
      test: ["CMD", "/usr/local/bin/of", "probe", "--dir-sockets", "/data/provider/listeners"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  # T34: D1 data plane — persistence level is LOCAL FSYNC ONLY
  # (no replication, single writer, epoch=1). The provider reaches
  # vrt-sql over the internal network with a signed-token HMAC;
  # rootfs is read-only, SQLite temp files go to a tmpfs, durable
  # data lives only on the /data volume.
  vrt-sql:
    <<: [*vrt-common, *vrt-image]
    volumes:
      - vrt-data:/data
      # T36: dedicated object-store volume — manifest/segments/snapshots
      # live here (fs backend), independent of the mutable db dir.
      - vrt-sql-objects:/data/objstore
    depends_on:
      vrt-init:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/vrt-sql"]
    command: ["--config", "/data/config/vrt-sql.toml"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    healthcheck:
      test: ["CMD", "/usr/local/bin/of", "probe", "--url", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  # Public TLS entry — `VRT_TLS_EMAIL=you@example.com docker compose --profile tls up`.
  # Traefik owns :80/:443 and proxies every HTTPS request to vrt-host's
  # ingress (which routes workers by Host header). ACME issues one
  # Let's Encrypt certificate per SNI hostname at first handshake —
  # `of hostnames add` hosts and `[preview] domain` subdomains need no
  # reload. Point DNS A/AAAA records at this host; keep vrt-host's own
  # port on VRT_BIND=127.0.0.1 for local `of`/conformance use.
  traefik:
    profiles: ["tls"]
    image: ${TRAEFIK_IMAGE:-traefik:v3.3}
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.docker=false
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${VRT_TLS_EMAIL:-}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      # VRT_TLS_CA=.../directory points at the LE staging CA for tests.
      - --certificatesresolvers.le.acme.caserver=${VRT_TLS_CA:-https://acme-v02.api.letsencrypt.org/directory}
      - --api=false
      - --log.level=${TRAEFIK_LOG_LEVEL:-WARN}
    ports:
      - "${VRT_TLS_BIND:-0.0.0.0}:80:80"
      - "${VRT_TLS_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./traefik/dynamic:/dynamic:ro
      - traefik-acme:/acme
    depends_on:
      vrt-host:
        condition: service_started

  # B12: optional monitoring — `docker compose --profile monitoring up`.
  # VictoriaMetrics single-node scrapes the internal /metrics ports
  # every 30s (7d retention); query UI on ${VM_BIND:-127.0.0.1}:8428.
  victoria-metrics:
    profiles: ["monitoring"]
    image: ${VM_IMAGE:-victoriametrics/victoria-metrics:v1.108.0}
    restart: unless-stopped
    command:
      - -promscrape.config=/etc/vm/promscrape.yml
      - -retentionPeriod=7d
      - -httpListenAddr=0.0.0.0:8428
    volumes:
      - ./monitoring/promscrape.yml:/etc/vm/promscrape.yml:ro
      - vm-data:/victoria-metrics-data
    ports:
      - "${VM_BIND:-127.0.0.1}:${VM_PORT:-8428}:8428"
    depends_on:
      vrt-host:
        condition: service_started

  # B12: rule evaluation + notification for the monitoring profile.
  # vmalert reads the SAME canonical rule file the runtime repo ships
  # (`deploy/alerts/openflare-runtime.yaml`); Alertmanager's default
  # receiver is silent on purpose — an operator overlay supplies the
  # real route. Both listen on loopback by default.
  alertmanager:
    profiles: ["monitoring"]
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.1}
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    volumes:
      - ${ALERTMANAGER_CONFIG:-./monitoring/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_BIND:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    depends_on:
      victoria-metrics:
        condition: service_started

  vmalert:
    profiles: ["monitoring"]
    image: ${VMALERT_IMAGE:-victoriametrics/vmalert:v1.108.0}
    restart: unless-stopped
    command:
      - -rule=/etc/vmalert/openflare-runtime.yaml
      - -datasource.url=${VMALERT_DATASOURCE_URL:-http://victoria-metrics:8428}
      - -remoteRead.url=${VMALERT_DATASOURCE_URL:-http://victoria-metrics:8428}
      - -remoteWrite.url=${VMALERT_REMOTE_WRITE_URL:-http://victoria-metrics:8428}
      - -notifier.url=${VMALERT_NOTIFIER_URL:-http://alertmanager:9093}
      - -evaluationInterval=30s
      - -httpListenAddr=0.0.0.0:8880
    volumes:
      - ../alerts/openflare-runtime.yaml:/etc/vmalert/openflare-runtime.yaml:ro
    ports:
      - "${VMALERT_BIND:-127.0.0.1}:${VMALERT_PORT:-8880}:8880"
    depends_on:
      victoria-metrics:
        condition: service_started
      alertmanager:
        condition: service_started

volumes:
  # Plain named volume: Docker copies the image's /data ownership
  # (vrt:vrt 0700) on first create — no manual chown needed.
  vrt-data:
  # T36: vrt-sql object persistence (fs backend) — separate volume so
  # manifest/segment data survives independently of db file churn.
  vrt-sql-objects:
  vm-data:
  alertmanager-data:
  # LE account key + issued certs (acme.json, mode 600 managed by Traefik).
  traefik-acme:
